services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myblog
      POSTGRES_PASSWORD: myblog_dev
      POSTGRES_DB: myblog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myblog -d myblog"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
